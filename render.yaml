services:
  - type: web
    name: marketplace-backend
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: marketplace-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: marketplace-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: marketplace-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: marketplace-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marketplace-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: marketplace-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: javacommerce
    user: marketplace_user
    diskSizeGB: 1
    ipAllowList: []
