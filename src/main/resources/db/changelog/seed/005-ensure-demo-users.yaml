databaseChangeLog:
  - changeSet:
      id: 021-ensure-demo-users
      author: codex
      comment: Ensure predictable customer and admin accounts for local testing.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO users (first_name, last_name, email, password, enabled, created_at)
              SELECT 'Demo', 'Customer', 'customer@example.com', '$2b$10$iEvmX0qZdCXYtfOOStaWJ.x8/uWrsP9IZMd0vuCsjmUV1KXtR5.fm', TRUE, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE email = 'customer@example.com');

              INSERT INTO users (first_name, last_name, email, password, enabled, created_at)
              SELECT 'Demo', 'Administrator', 'admin@example.com', '$2b$10$iEvmX0qZdCXYtfOOStaWJ.x8/uWrsP9IZMd0vuCsjmUV1KXtR5.fm', TRUE, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE email = 'admin@example.com');

              UPDATE users
              SET password = '$2b$10$iEvmX0qZdCXYtfOOStaWJ.x8/uWrsP9IZMd0vuCsjmUV1KXtR5.fm', enabled = TRUE
              WHERE email IN ('customer@example.com', 'admin@example.com');

  - changeSet:
      id: 022-ensure-demo-user-roles
      author: codex
      comment: Ensure the demo accounts have their expected roles.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u, roles r
              WHERE u.email = 'customer@example.com'
                AND r.name = 'ROLE_CUSTOMER'
                AND NOT EXISTS (
                  SELECT 1 FROM user_roles ur
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                );

              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u, roles r
              WHERE u.email = 'admin@example.com'
                AND r.name = 'ROLE_ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM user_roles ur
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                );
